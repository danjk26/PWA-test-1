<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tracker</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto 20px auto; }
        h1, h2 { text-align: center; margin-top: 0; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1em; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background-color: #0056b3; }
        
        .counter-btn { background-color: #28a745; font-size: 1.8em; padding: 20px; margin-top: 10px; }
        .counter-btn:active { background-color: #1e7e34; transform: scale(0.98); }
        .rep-display { text-align: center; font-size: 3em; font-weight: bold; margin: 10px 0; color: #007bff; }
        .secondary-btn { background-color: #6c757d; margin-top: 10px; }
        .status-bar { text-align: center; font-size: 0.85em; padding: 5px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="status" class="status-bar">Checking status...</div>
        <h1>Exercise Tracker</h1>
    </div>

    <!-- 1. SETUP EXERCISE SECTION -->
    <div class="card">
        <h2>1. Create New Exercise</h2>
        <label for="new-exercise-name">Exercise Name</label>
        <input type="text" id="new-exercise-name" placeholder="e.g., Shoulder Press, Band Pulls">
        <button onclick="saveNewExercise()">Save Exercise</button>
    </div>

    <!-- 2. LOG WORKOUT SECTION -->
    <div class="card">
        <h2>2. Track Workout</h2>
        
        <label for="exercise-select">Select Exercise</label>
        <select id="exercise-select">
            <option value="">-- Choose an exercise --</option>
        </select>

        <label for="intensity-input">Intensity / Weight (e.g., 5 lbs, Band Level 2)</label>
        <input type="text" id="intensity-input" placeholder="e.g., 10 lbs">

        <label>Current Reps Completed</label>
        <div id="rep-count" class="rep-display">0</div>

        <button class="counter-btn" onclick="addRep()">+1 Rep</button>
        <button class="secondary-btn" onclick="resetReps()">Reset Rep Count</button>
    </div>

    <!-- 3. UPDATE APP SECTION -->
    <div class="card" style="text-align: center;">
        <button id="update-btn" class="secondary-btn" onclick="checkForAppUpdate()">Check for App Update</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Failed', err));
        }

        const statusDiv = document.getElementById('status');
        function updateStatus() {
            if (navigator.onLine) {
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                statusDiv.innerText = 'Online';
            } else {
                statusDiv.style.backgroundColor = '#f8d7da';
                statusDiv.style.color = '#721c24';
                statusDiv.innerText = 'Offline Mode';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        let currentReps = 0;

        document.addEventListener('DOMContentLoaded', loadExerciseDropdown);

        function saveNewExercise() {
            const nameInput = document.getElementById('new-exercise-name');
            const exerciseName = nameInput.value.trim();

            if (!exerciseName) {
                alert('Please enter an exercise name.');
                return;
            }

            let exercises = JSON.parse(localStorage.getItem('exercises')) || [];
            
            if (!exercises.includes(exerciseName)) {
                exercises.push(exerciseName);
                localStorage.setItem('exercises', JSON.stringify(exercises));
                nameInput.value = '';
                loadExerciseDropdown();
                alert(`Saved "${exerciseName}"!`);
            } else {
                alert('That exercise already exists.');
            }
        }

        function loadExerciseDropdown() {
            const dropdown = document.getElementById('exercise-select');
            const exercises = JSON.parse(localStorage.getItem('exercises')) || [];

            dropdown.innerHTML = '<option value="">-- Choose an exercise --</option>';
            exercises.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                dropdown.appendChild(opt);
            });
        }

        function addRep() {
            const selectedExercise = document.getElementById('exercise-select').value;
            if (!selectedExercise) {
                alert('Please select an exercise first!');
                return;
            }

            currentReps += 1;
            document.getElementById('rep-count').innerText = currentReps;
        }

        function resetReps() {
            currentReps = 0;
            document.getElementById('rep-count').innerText = currentReps;
        }

        function checkForAppUpdate() {
            const updateBtn = document.getElementById('update-btn');
            updateBtn.innerText = 'Checking GitHub...';

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (registration) {
                        registration.update().then(() => {
                            if (registration.waiting) {
                                registration.waiting.postMessage('skipWaiting');
                                alert('New update found! Reloading app...');
                                window.location.reload();
                            } else {
                                registration.addEventListener('updatefound', () => {
                                    const newWorker = registration.installing;
                                    newWorker.addEventListener('statechange', () => {
                                        if (newWorker.state === 'installed') {
                                            alert('New update installed! Reloading app...');
                                            window.location.reload();
                                        }
                                    });
                                });
                                
                                setTimeout(() => {
                                    updateBtn.innerText = 'Check for App Update';
                                    alert('App is already up to date!');
                                }, 1200);
                            }
                        }).catch(err => {
                            updateBtn.innerText = 'Check for App Update';
                            alert('Could not check for updates. Make sure you are online.');
                        });
                    } else {
                        updateBtn.innerText = 'Check for App Update';
                        alert('No Service Worker active.');
                    }
                });
            } else {
                alert('Service Worker is not supported in this browser.');
            }
        }
    </script>
</body>
</html>
