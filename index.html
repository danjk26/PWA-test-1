<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tracker</title>
    <link rel="manifest" href="manifest.json">
    <!-- Chart.js for offline progress graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        
        /* Fixed Header and Status */
        header { background: #007bff; color: white; padding: 15px; text-align: center; }
        h1 { margin: 0; font-size: 1.4em; }
        .status-bar { text-align: center; font-size: 0.8em; padding: 4px; border-radius: 4px; margin-top: 8px; font-weight: bold; }
        
        /* Top Navigation Tabs */
        nav { display: flex; background: #0056b3; overflow-x: auto; }
        nav button { flex: 1; background: none; border: none; color: #d0e2ff; padding: 12px 8px; font-size: 0.9em; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; border-radius: 0; margin: 0; white-space: nowrap; }
        nav button.active { color: white; border-bottom: 3px solid #white; background: rgba(255,255,255,0.1); }
        
        /* Page Views */
        .page { display: none; padding: 20px; max-width: 480px; margin: 0 auto; }
        .page.active { display: block; }
        
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; margin-top: 0; font-size: 1.2em; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1em; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background-color: #0056b3; }
        
        .inline-group { display: flex; gap: 10px; }
        .inline-group > div { flex: 1; }
        
        /* Multiplier Toggle Bar */
        .multiplier-bar { display: flex; gap: 8px; margin-top: 8px; }
        .mult-btn { flex: 1; padding: 8px; font-size: 0.85em; background: #e9ecef; color: #495057; border: 1px solid #ced4da; margin-top: 0; }
        .mult-btn.active { background: #007bff; color: white; border-color: #007bff; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .counter-btn { background-color: #28a745; font-size: 1.4em; padding: 18px; flex: 2; margin-top: 0; }
        .undo-btn { background-color: #dc3545; font-size: 1.1em; padding: 18px; flex: 1; margin-top: 0; }
        .save-set-btn { background-color: #17a2b8; font-size: 1.1em; padding: 15px; }
        .danger-btn { background-color: #dc3545; margin-top: 10px; }
        .export-btn { background-color: #28a745; margin-top: 10px; }
        .secondary-btn { background-color: #6c757d; margin-top: 10px; }
        
        .rep-display { text-align: center; font-size: 3em; font-weight: bold; margin: 10px 0; color: #007bff; }
        .log-item { background: #f8f9fa; border-left: 4px solid #007bff; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 0.95em; }
        .log-date { font-size: 0.75em; color: #6c6c6c; margin-top: 4px; }
        .chart-container { position: relative; width: 100%; height: 260px; margin-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Exercise Tracker</h1>
        <div id="status" class="status-bar">Checking status...</div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchPage('track-page', this)">Track</button>
        <button class="nav-btn" onclick="switchPage('setup-page', this)">Setup</button>
        <button class="nav-btn" onclick="switchPage('chart-page', this)">Charts</button>
        <button class="nav-btn" onclick="switchPage('history-page', this)">History</button>
        <button class="nav-btn" onclick="switchPage('settings-page', this)">Settings</button>
    </nav>

    <!-- PAGE 1: TRACK WORKOUT -->
    <div id="track-page" class="page active">
        <div class="card">
            <h2>Track Workout</h2>
            
            <label for="exercise-select">Select Exercise</label>
            <select id="exercise-select" onchange="updateChart()">
                <option value="">-- Choose an exercise --</option>
            </select>

            <div class="inline-group">
                <div>
                    <label for="weight-input">Weight / Load</label>
                    <input type="number" id="weight-input" placeholder="0" min="0" step="0.5" value="0">
                </div>
                <div>
                    <label for="unit-select">Unit</label>
                    <select id="unit-select">
                        <!-- Populated dynamically from IndexedDB -->
                    </select>
                </div>
            </div>

            <label>Current Reps Completed</label>
            <div id="rep-count" class="rep-display">0</div>

            <!-- Rep Multiplier Selector -->
            <label>Add Step Increment</label>
            <div class="multiplier-bar">
                <button class="mult-btn active" onclick="setStep(1, this)">+1</button>
                <button class="mult-btn" onclick="setStep(5, this)">+5</button>
                <button class="mult-btn" onclick="setStep(10, this)">+10</button>
            </div>

            <div class="btn-row">
                <button id="add-rep-btn" class="counter-btn" onclick="addRep()">+1 Rep</button>
                <button id="undo-rep-btn" class="undo-btn" onclick="undoRep()">-1 Rep</button>
            </div>

            <button class="save-set-btn" onclick="commitSet()">Save Completed Set</button>
            <button class="secondary-btn" onclick="resetReps()">Reset Rep Count</button>
        </div>
    </div>

    <!-- PAGE 2: EXERCISE SETUP -->
    <div id="setup-page" class="page">
        <div class="card">
            <h2>Exercise Setup</h2>
            <label for="new-exercise-name">New Exercise Name</label>
            <input type="text" id="new-exercise-name" placeholder="e.g., Shoulder Press, Band Pulls">
            <button onclick="saveNewExercise()">Save Exercise</button>
            
            <label for="delete-exercise-select" style="margin-top:20px;">Delete Existing Exercise</label>
            <select id="delete-exercise-select">
                <option value="">-- Select exercise to delete --</option>
            </select>
            <button class="danger-btn" onclick="deleteExercise()">Delete Selected Exercise</button>
        </div>
    </div>

    <!-- PAGE 3: PROGRESS CHARTS -->
    <div id="chart-page" class="page">
        <div class="card">
            <h2>Progress Chart</h2>
            
            <div class="inline-group">
                <div>
                    <label for="chart-metric-select">Metric to Plot</label>
                    <select id="chart-metric-select" onchange="updateChart()">
                        <option value="sumWeight">Total Weight / Load (Sum)</option>
                        <option value="maxWeight">Max Weight / Load Logged</option>
                        <option value="totalVolume">Total Volume (Reps × Weight)</option>
                        <option value="totalReps">Total Reps Completed</option>
                    </select>
                </div>
                <div>
                    <label for="chart-timeframe-select">Group By</label>
                    <select id="chart-timeframe-select" onchange="updateChart()">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
        </div>
    </div>

    <!-- PAGE 4: HISTORY LOG -->
    <div id="history-page" class="page">
        <div class="card">
            <h2>Workout History</h2>
            <div id="history-container">No completed sets logged yet.</div>
            <button class="secondary-btn" onclick="clearHistory()" style="margin-top:15px; font-size: 0.8em;">Clear History Log</button>
        </div>
    </div>

    <!-- PAGE 5: BACKUP & SETTINGS -->
    <div id="settings-page" class="page">
        <div class="card">
            <h2>Manage Units</h2>
            <label for="new-unit-name">Add Custom Unit</label>
            <input type="text" id="new-unit-name" placeholder="e.g., stone, plates, sec">
            <button onclick="saveNewUnit()">Add Unit</button>
            
            <label for="delete-unit-select" style="margin-top:20px;">Delete Existing Unit</label>
            <select id="delete-unit-select">
                <option value="">-- Select unit to delete --</option>
            </select>
            <button class="danger-btn" onclick="deleteUnit()">Delete Selected Unit</button>
        </div>

        <div class="card">
            <h2>Backup & Data</h2>
            <button class="export-btn" onclick="exportDataJSON()">Export JSON Backup</button>
            <button class="export-btn" style="background-color: #20c997;" onclick="exportDataCSV()">Export CSV (Spreadsheet)</button>
            
            <input type="file" id="import-file" accept=".json" onchange="importDataJSON(event)">
            <button class="secondary-btn" onclick="document.getElementById('import-file').click()">Import JSON Backup</button>
        </div>

        <div class="card" style="text-align: center;">
            <h2>App Updates</h2>
            <button id="update-btn" class="secondary-btn" onclick="checkForAppUpdate()">Check for App Update</button>
        </div>
    </div>

    <script>
        // --- NAVIGATION ---
        function switchPage(pageId, btnElement) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            btnElement.classList.add('active');

            if (pageId === 'chart-page') {
                updateChart();
            }
        }

        // --- INDEXEDDB SETUP ---
        const DB_NAME = 'ExerciseTrackerDB';
        const DB_VERSION = 2;
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('exercises')) {
                        database.createObjectStore('exercises', { keyPath: 'name' });
                    }
                    if (!database.objectStoreNames.contains('workoutHistory')) {
                        const historyStore = database.createObjectStore('workoutHistory', { keyPath: 'id' });
                        historyStore.createIndex('exercise', 'exercise', { unique: false });
                        historyStore.createIndex('timestamp', 'timestamp', { unique: false });
                    }
                    if (!database.objectStoreNames.contains('units')) {
                        database.createObjectStore('units', { keyPath: 'name' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbPut(storeName, item) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(item);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function dbClear(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Failed', err));
        }

        // Online/Offline Status
        const statusDiv = document.getElementById('status');
        function updateStatus() {
            if (navigator.onLine) {
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                statusDiv.innerText = 'Online';
            } else {
                statusDiv.style.backgroundColor = '#f8d7da';
                statusDiv.style.color = '#721c24';
                statusDiv.innerText = 'Offline Mode';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        let currentReps = 0;
        let repStep = 1;
        let myChart = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await openDB();
            await seedDefaultUnits();
            await loadUnitsDropdowns();
            await loadExerciseDropdowns();
            await renderHistory();
            initChart();
        });

        // --- UNITS MANAGEMENT ---
        async function seedDefaultUnits() {
            const existing = await dbGetAll('units');
            if (existing.length === 0) {
                const defaults = ['lbs', 'kg', 'level', 'bw'];
                for (let u of defaults) {
                    await dbPut('units', { name: u });
                }
            }
        }

        async function saveNewUnit() {
            const input = document.getElementById('new-unit-name');
            const unitName = input.value.trim().toLowerCase();

            if (!unitName) {
                alert('Please enter a unit name.');
                return;
            }

            const existing = await dbGetAll('units');
            if (!existing.some(u => u.name === unitName)) {
                await dbPut('units', { name: unitName });
                input.value = '';
                await loadUnitsDropdowns();
                alert(`Added unit "${unitName}"!`);
            } else {
                alert('That unit already exists.');
            }
        }

        async function deleteUnit() {
            const dropdown = document.getElementById('delete-unit-select');
            const selectedUnit = dropdown.value;

            if (!selectedUnit) {
                alert('Please select a unit to delete.');
                return;
            }

            if (confirm(`Are you sure you want to delete unit "${selectedUnit}"?`)) {
                await dbDelete('units', selectedUnit);
                await loadUnitsDropdowns();
                alert(`Deleted unit "${selectedUnit}".`);
            }
        }

        async function loadUnitsDropdowns() {
            const trackSelect = document.getElementById('unit-select');
            const deleteSelect = document.getElementById('delete-unit-select');
            const units = await dbGetAll('units');

            trackSelect.innerHTML = '';
            deleteSelect.innerHTML = '<option value="">-- Select unit to delete --</option>';

            units.forEach(u => {
                const opt1 = document.createElement('option');
                opt1.value = u.name;
                opt1.innerText = u.name;
                trackSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = u.name;
                opt2.innerText = u.name;
                deleteSelect.appendChild(opt2);
            });
        }

        // --- EXERCISE MANAGEMENT ---
        async function saveNewExercise() {
            const nameInput = document.getElementById('new-exercise-name');
            const exerciseName = nameInput.value.trim();

            if (!exerciseName) {
                alert('Please enter an exercise name.');
                return;
            }

            const existing = await dbGetAll('exercises');
            if (!existing.some(ex => ex.name === exerciseName)) {
                await dbPut('exercises', { name: exerciseName });
                nameInput.value = '';
                await loadExerciseDropdowns();
                alert(`Saved "${exerciseName}"!`);
            } else {
                alert('That exercise already exists.');
            }
        }

        async function deleteExercise() {
            const dropdown = document.getElementById('delete-exercise-select');
            const selectedExercise = dropdown.value;

            if (!selectedExercise) {
                alert('Please select an exercise to delete.');
                return;
            }

            if (confirm(`Are you sure you want to delete "${selectedExercise}"?`)) {
                await dbDelete('exercises', selectedExercise);
                await loadExerciseDropdowns();
                alert(`Deleted "${selectedExercise}".`);
            }
        }

        async function loadExerciseDropdowns() {
            const logDropdown = document.getElementById('exercise-select');
            const deleteDropdown = document.getElementById('delete-exercise-select');
            const exercises = await dbGetAll('exercises');

            logDropdown.innerHTML = '<option value="">-- Choose an exercise --</option>';
            deleteDropdown.innerHTML = '<option value="">-- Select exercise to delete --</option>';

            exercises.forEach(item => {
                const opt1 = document.createElement('option');
                opt1.value = item.name;
                opt1.innerText = item.name;
                logDropdown.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = item.name;
                opt2.innerText = item.name;
                deleteDropdown.appendChild(opt2);
            });
            updateChart();
        }

        // --- REP COUNTER & MULTIPLIER ---
        function setStep(stepVal, btnElement) {
            repStep = stepVal;
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            document.getElementById('add-rep-btn').innerText = `+${repStep} Rep${repStep > 1 ? 's' : ''}`;
            document.getElementById('undo-rep-btn').innerText = `-${repStep} Rep${repStep > 1 ? 's' : ''}`;
        }

        function addRep() {
            const selectedExercise = document.getElementById('exercise-select').value;
            if (!selectedExercise) {
                alert('Please select an exercise first!');
                return;
            }
            currentReps += repStep;
            document.getElementById('rep-count').innerText = currentReps;
        }

        function undoRep() {
            if (currentReps >= repStep) {
                currentReps -= repStep;
            } else {
                currentReps = 0;
            }
            document.getElementById('rep-count').innerText = currentReps;
        }

        function resetReps() {
            currentReps = 0;
            document.getElementById('rep-count').innerText = currentReps;
        }

        // --- LOGGING WORKOUT SETS ---
        async function commitSet() {
            const selectedExercise = document.getElementById('exercise-select').value;
            const weightVal = parseFloat(document.getElementById('weight-input').value) || 0;
            const unitVal = document.getElementById('unit-select').value || 'lbs';

            if (!selectedExercise) {
                alert('Please select an exercise before saving.');
                return;
            }

            if (currentReps <= 0) {
                alert('Please add at least 1 rep before saving a set.');
                return;
            }

            const now = new Date();
            const newSet = {
                id: now.getTime(),
                exercise: selectedExercise,
                weight: weightVal,
                unit: unitVal,
                reps: currentReps,
                timestamp: now.toISOString(),
                displayDate: now.toLocaleString()
            };

            await dbPut('workoutHistory', newSet);

            resetReps();
            await renderHistory();
            updateChart();
            alert('Set saved to database!');
        }

        async function renderHistory() {
            const container = document.getElementById('history-container');
            const history = await dbGetAll('workoutHistory');

            if (history.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">No completed sets logged yet.</p>';
                return;
            }

            history.sort((a, b) => b.id - a.id);

            container.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `
                    <strong>${item.exercise}</strong> — ${item.reps} reps @ <em>${item.weight} ${item.unit}</em>
                    <div class="log-date">${item.displayDate || new Date(item.timestamp).toLocaleString()}</div>
                `;
                container.appendChild(div);
            });
        }

        async function clearHistory() {
            if (confirm('Are you sure you want to clear your entire workout history log?')) {
                await dbClear('workoutHistory');
                await renderHistory();
                updateChart();
            }
        }

        // --- CHARTING ENGINE ---
        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Progress',
                        data: [],
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { display: true },
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function getTimeframeKey(dateObj, timeframe) {
            if (timeframe === 'weekly') {
                const startOfYear = new Date(dateObj.getFullYear(), 0, 1);
                const pastDaysOfYear = (dateObj - startOfYear) / 86400000;
                const weekNum = Math.ceil((pastDaysOfYear + startOfYear.getDay() + 1) / 7);
                return `W${weekNum} (${dateObj.getFullYear()})`;
            } else if (timeframe === 'monthly') {
                return dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
            }
            return dateObj.toLocaleDateString(); // Daily default
        }

        async function updateChart() {
            if (!myChart) return;
            const selectedExercise = document.getElementById('exercise-select').value;
            const metric = document.getElementById('chart-metric-select').value;
            const timeframe = document.getElementById('chart-timeframe-select').value;

            if (!selectedExercise) {
                myChart.data.labels = [];
                myChart.data.datasets[0].data = [];
                myChart.update();
                return;
            }

            const allHistory = await dbGetAll('workoutHistory');
            const exerciseData = allHistory
                .filter(item => item.exercise === selectedExercise)
                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            const grouped = {};
            exerciseData.forEach(item => {
                const d = new Date(item.timestamp);
                const timeKey = getTimeframeKey(d, timeframe);
                if (!grouped[timeKey]) grouped[timeKey] = [];
                grouped[timeKey].push(item);
            });

            const labels = Object.keys(grouped);
            const dataValues = labels.map(key => {
                const sets = grouped[key];
                if (metric === 'sumWeight') {
                    return sets.reduce((sum, s) => sum + s.weight, 0);
                } else if (metric === 'maxWeight') {
                    return Math.max(...sets.map(s => s.weight));
                } else if (metric === 'totalVolume') {
                    return sets.reduce((sum, s) => sum + (s.weight * s.reps), 0);
                } else if (metric === 'totalReps') {
                    return sets.reduce((sum, s) => sum + s.reps, 0);
                }
            });

            myChart.data.labels = labels;
            myChart.data.datasets[0].label = `${selectedExercise} - ${metric} (${timeframe})`;
            myChart.data.datasets[0].data = dataValues;
            myChart.update();
        }

        // --- BACKUP IMPORT & EXPORT ---
        async function exportDataJSON() {
            const exercises = await dbGetAll('exercises');
            const workoutHistory = await dbGetAll('workoutHistory');
            const units = await dbGetAll('units');
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ exercises, workoutHistory, units }, null, 2));
            
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `exercise_tracker_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        async function exportDataCSV() {
            const workoutHistory = await dbGetAll('workoutHistory');
            if (workoutHistory.length === 0) {
                alert('No workout history available to export.');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,ID,Exercise,Weight,Unit,Reps,Timestamp,Date\n";
            workoutHistory.forEach(item => {
                const dateStr = item.displayDate ? `"${item.displayDate}"` : `"${new Date(item.timestamp).toLocaleString()}"`;
                csvContent += `${item.id},"${item.exercise}",${item.weight},"${item.unit}",${item.reps},"${item.timestamp}",${dateStr}\n`;
            });

            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", encodeURI(csvContent));
            dlAnchor.setAttribute("download", `workout_history_${Date.now()}.csv`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importDataJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.exercises && Array.isArray(data.exercises)) {
                        for (let ex of data.exercises) await dbPut('exercises', ex);
                    }
                    if (data.workoutHistory && Array.isArray(data.workoutHistory)) {
                        for (let item of data.workoutHistory) await dbPut('workoutHistory', item);
                    }
                    if (data.units && Array.isArray(data.units)) {
                        for (let u of data.units) await dbPut('units', u);
                    }
                    await loadUnitsDropdowns();
                    await loadExerciseDropdowns();
                    await renderHistory();
                    updateChart();
                    alert('Data imported successfully!');
                } catch (err) {
                    alert('Invalid JSON file format.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        // --- APP UPDATE CHECKER ---
        function checkForAppUpdate() {
            const updateBtn = document.getElementById('update-btn');
            updateBtn.innerText = 'Checking GitHub...';

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (!registration) {
                        updateBtn.innerText = 'Check for App Update';
                        alert('No active service worker found.');
                        return;
                    }

                    let refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!refreshing) {
                            refreshing = true;
                            window.location.reload();
                        }
                    });

                    fetch('./sw.js?t=' + Date.now(), { cache: 'no-store' })
                        .then(() => registration.update())
                        .then(() => {
                            if (registration.waiting) {
                                updateBtn.innerText = 'Updating...';
                                registration.waiting.postMessage('skipWaiting');
                            } else if (registration.installing) {
                                updateBtn.innerText = 'Installing update...';
                                registration.installing.addEventListener('statechange', (e) => {
                                    if (e.target.state === 'installed') {
                                        registration.waiting.postMessage('skipWaiting');
                                    }
                                });
                            } else {
                                setTimeout(() => {
                                    updateBtn.innerText = 'Check for App Update';
                                    alert('App is already up to date!');
                                }, 1000);
                            }
                        })
                        .catch(err => {
                            updateBtn.innerText = 'Check for App Update';
                            alert('Could not check for updates. Check connection.');
                        });
                });
            } else {
                alert('Service Workers not supported.');
            }
        }
    </script>
